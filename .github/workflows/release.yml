# U166: automated releases on every push to master.
#
#   push to master ─→ test gate ─┬→ build installers (Windows / macOS / Linux)
#                                ├→ demo-stack screenshots (optional, no PII)
#                                └→ tag + GitHub Release with notes, ledger
#                                   highlights, screenshots and all installers
#
# Screenshots are privacy-safe BY CONSTRUCTION: they come from a stack booted
# inside the runner (fake robot, echo LLM, in-memory store) whose only profile
# is the fictional demo persona — no camera, no keys, no personal data exists
# in that environment. Skip a release with "[skip release]" in the commit.

name: Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]          # manual tags keep working as before
  workflow_dispatch:

# U317: creating a release writes to the repository. This grant is at the top
# so every job has it, AND repeated on the `release` job itself — a job-level
# block is the most specific scope GitHub honours, and this failed silently
# once already (v2.0.127, 403 "Resource not accessible by integration").
#
# It is not sufficient on its own. The repository setting
#   Settings -> Actions -> General -> Workflow permissions
# must be "Read and write permissions". With it on "Read repository contents",
# releases 403 no matter what this file says. Check with:
#   gh api repos/<owner>/<repo>/actions/permissions/workflow
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never abort a half-published release

jobs:
  version:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # U172: semver bump needs tags + commit history
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # An explicit tag push always wins.
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            # U172: SEMANTIC bump from commit messages since the last release.
            #   [major] anywhere in a commit → X+1.0.0
            #   [minor]                      → X.Y+1.0
            #   otherwise                    → X.Y.Z+1  (most units are fixes)
            PREV=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -z "$PREV" ]; then
              VERSION="1.0.0"
            else
              BASE="${PREV#v}"
              MAJ="${BASE%%.*}"; REST="${BASE#*.}"
              MIN="${REST%%.*}"; PAT="${REST#*.}"
              # U174: SUBJECT lines only — a commit BODY that merely
              # DESCRIBES the markers set off a major bump (v1.5.0 went
              # straight to v2.0.0 because the U172 message explained
              # the convention). Markers belong in the commit title.
              LOG=$(git log --pretty=%s "$PREV"..HEAD)
              if echo "$LOG" | grep -q '\[major\]'; then
                MAJ=$((MAJ+1)); MIN=0; PAT=0
              elif echo "$LOG" | grep -q '\[minor\]'; then
                MIN=$((MIN+1)); PAT=0
              else
                PAT=$((PAT+1))
              fi
              VERSION="${MAJ}.${MIN}.${PAT}"
            fi
            TAG="v${VERSION}"
          fi
          echo "release version: ${VERSION} (previous: ${PREV:-none})"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  test:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: echo   # U168b: never depend on a real key in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Privacy scan (U167 — nothing personal ships in a release)
        run: python scripts/privacy_scan.py --all
      - name: Install uv
        run: pip install uv
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Python suites
        run: |
          uv run --package shared-schemas --extra dev pytest packages/shared-schemas/tests -q
          uv run --package shared-events --extra dev pytest packages/shared-events/tests -q
          uv run --package shared-policies --extra dev pytest packages/shared-policies/tests -q
          uv run --package shared-personas --extra dev pytest packages/shared-personas/tests -q
          uv run --package robot-runtime --extra dev pytest services/robot-runtime/tests -q
          uv run --package memory-service --extra dev pytest services/memory-service/tests -q
          uv run --package orchestrator --extra dev pytest services/orchestrator/tests -q
          uv run --package conversation-runtime --extra dev pytest services/conversation-runtime/tests -q
          uv run --package connector-service --extra dev pytest services/connector-service/tests -q
          uv run --package aura-brain --extra dev pytest apps/aura-brain/tests -q
      - name: Console suite
        working-directory: apps/operator-console
        run: |
          npm ci
          npm test
          npm run build
      # U235: the shell is the one thing the release BUILDS and nothing here
      # checked. A module left out of build.files packages cleanly and dies on
      # the owner's first launch — which is how v2.0.58 shipped.
      - name: Desktop shell checks
        working-directory: apps/desktop
        run: |
          node test-packaging.cjs
          node test-console-origin.cjs
          node test-updater-verify.cjs
          node test-bootstrap-extras.cjs

  # Boot a throwaway demo stack and photograph the app. Optional: a release
  # without screenshots beats no release, so failures here never block.
  #
  # U235: "never block" turned out to mean "never noticed". This job failed on
  # every release for weeks — a `networkidle` wait against a console that holds
  # a WebSocket open — and the releases went out screenshot-less without a word.
  # It still cannot block a release; it now says so in the release notes, so a
  # silent failure at least leaves a mark where somebody reads it.
  screenshots:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install uv
        run: pip install uv
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Build console against the local demo brain
        working-directory: apps/operator-console
        env:
          VITE_BRAIN_URL: http://localhost:8020
          VITE_CONVERSATION_URL: http://localhost:8020   # chat posts go here
          VITE_ROBOT_RUNTIME_WS: ws://localhost:8020/ws/events
        run: |
          npm ci
          npm run build
      - name: Boot the demo stack (fake robot + echo LLM + demo persona)
        run: |
          # Fully isolated state: an empty skills vault and a throwaway DB, so
          # nothing that happens to sit in the checkout or runner can leak
          # into the screenshots. The only profile is the fictional demo one.
          #
          # KNOWLEDGE_DB_PATH and RECOGNITION_DB_PATH matter more than they
          # look: both default to ./data, which on a developer's machine is a
          # real knowledge store sitting in the checkout. Pointing them at the
          # throwaway directory is what makes this stack safe to run locally as
          # well as in CI.
          mkdir -p "$RUNNER_TEMP/demo-skills" "$RUNNER_TEMP/demo-data"
          # Encrypts the throwaway store so the shots show the encrypted state
          # instead of a "set a passphrase" nag. It guards one fictional demo
          # persona and dies with the runner.
          DEMO_PASSPHRASE='demo-stack-passphrase'   # privacy-ok: fictional demo data only
          ROBOT_ADAPTER=fake PORT=8001 \
            nohup uv run --package robot-runtime robot-runtime > robot.log 2>&1 &
          LLM_PROVIDER=echo PORT=8020 ROBOT_RUNTIME_URL=http://localhost:8001 \
            CORS_ORIGINS='*' DEMO_PERSONA=true VOICE_MODE=off \
            SKILLS_DIR="$RUNNER_TEMP/demo-skills" \
            DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/demo-data/memory.db" \
            KNOWLEDGE_DB_PATH="$RUNNER_TEMP/demo-data/knowledge.enc.json" \
            RECOGNITION_DB_PATH="$RUNNER_TEMP/demo-data/recognition.enc.json" \
            KNOWLEDGE_PASSPHRASE="$DEMO_PASSPHRASE" \
            nohup uv run --package aura-brain aura-brain > brain.log 2>&1 &
          for url in http://localhost:8001/health http://localhost:8020/health; do
            for i in $(seq 1 60); do
              curl -sf "$url" > /dev/null && break
              sleep 2
            done
            curl -sf "$url" > /dev/null || { echo "$url never came up"; cat robot.log brain.log; exit 1; }
          done
      - name: Serve the console
        working-directory: apps/operator-console
        run: nohup npx vite preview --port 4173 > preview.log 2>&1 &
      - name: Capture screenshots
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          CONSOLE_URL=http://localhost:4173 OUT_DIR=shots \
            node .github/scripts/release-screenshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: error

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          - os: macos-latest
            args: --mac dmg zip --arm64 --x64
          - os: ubuntu-latest
            args: --linux AppImage deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build console
        working-directory: apps/operator-console
        run: |
          npm ci
          npm run build
      - name: Build installers
        working-directory: apps/desktop
        # bash on ALL runners (U169): Windows' default pwsh splits the
        # -c.extraMetadata.version=… flag, and electron-builder then reads it
        # as a config-file path ("ENOENT: .extraMetadata.version=1.1.0").
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned mac build
        run: |
          npm ci
          npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version=${{ needs.version.outputs.version }}
      - name: Verify packaged modules
        working-directory: apps/desktop
        # U176: every .cjs the main process requires MUST be inside app.asar.
        # updater.cjs was missing from the "files" list and v2.0.1/2 crashed
        # on launch ("Cannot find module './updater.cjs'") — packaging
        # succeeds regardless, so only an explicit check catches it.
        shell: bash
        run: |
          found=0
          while IFS= read -r asar; do
            found=1
            for f in main.cjs preload.cjs updater.cjs; do
              if ! npx @electron/asar list "$asar" | grep -q "[/\\]${f}\$"; then
                echo "FOUT: ${f} ontbreekt in ${asar}"
                exit 1
              fi
            done
            echo "OK: $asar bevat alle main-process-modules"
          done < <(find dist -name app.asar)
          [ "$found" = "1" ] || { echo "FOUT: geen app.asar gevonden"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: [version, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # U317: publishing a release writes to the repo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: notes diff against the last tag
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true  # screenshots are optional by design
        with:
          name: screenshots
          path: shots
      # U224 (S11): publish a checksum for every installer. The app verifies the
      # file it downloaded before running it, so a corrupted download or a file
      # swapped on disk between staging and install is caught rather than
      # executed.
      - name: Checksums
        run: |
          cd installers
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compose release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # U284: the page lives in scripts/release_notes.py, not in 40 lines
          # of bash here — so it can be read, reviewed and unit-tested like the
          # rest of the app (scripts/test_release_notes.py). The version that
          # lived here scraped a ledger format retired around U180, so the
          # "what's new" section had silently rendered nothing for months.
          PREV=$(git tag --list 'v*' --sort=-creatordate | head -1 || true)
          python3 scripts/release_notes.py             --tag "$TAG" --repo "$REPO" --prev "$PREV"             --shots-dir shots --out notes.md
          cat notes.md
      - name: Publish release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          # U284: false — the page we compose IS the page. GitHub's
          # auto-notes append a raw list of "auto(U283): ..." commits
          # under it, which is exactly the developer-facing wall the
          # new template replaces. The full technical history is linked
          # from the footer instead.
          generate_release_notes: false
          files: |
            installers/*
            shots/*.png
          draft: false

      # U317: a release that fails is invisible — the app simply never offers
      # an update, and the owner asks days later why nothing is arriving. It
      # already happened: v2.0.127 through v2.0.129 never published, and the
      # only trace was a red tick nobody was looking at.
      #
      # This turns the most likely cause into a sentence in the log rather than
      # a REST error code to go and look up.
      - name: Why the release failed
        if: failure() && steps.publish.outcome == 'failure'
        run: |
          echo "::error title=Release not published::The build succeeded; publishing did not."
          echo ""
          echo "Most likely cause — the repository's Actions token is read-only."
          echo "Check it:"
          echo "  gh api repos/${{ github.repository }}/actions/permissions/workflow"
          echo "If it says \"default_workflow_permissions\": \"read\", fix it at:"
          echo "  Settings -> Actions -> General -> Workflow permissions"
          echo "  -> Read and write permissions"
          echo ""
          echo "This file already requests 'contents: write' at both workflow"
          echo "and job level; the repository setting overrides it."
          echo ""
          echo "The installers for ${{ needs.version.outputs.tag }} are still"
          echo "attached to this run as artifacts — nothing was lost, it just"
          echo "was not published."
