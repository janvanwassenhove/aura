name: CI

# U166: this repo's branches are master + aura-autobuild — the old
# main/develop triggers meant CI never actually ran on pushes.
on:
  push:
    branches: [master, main, aura-autobuild]
  pull_request:
    branches: [master, main]

jobs:
  # U167: enforced backstop for the pre-commit privacy hook — the hook can be
  # bypassed (--no-verify, fresh clone without core.hooksPath); this cannot.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Privacy scan (no personal data in the tree)
        run: python scripts/privacy_scan.py --all
      - name: Scanner self-tests
        run: |
          pip install pytest
          pytest scripts/test_privacy_scan.py -q
      # U284: the release page is generated by a script now, so it is tested
      # like one. The version it replaced scraped a ledger format retired
      # around U180 and had been rendering an empty "what's new" section for
      # months — nothing was watching, because nothing could.
      - name: Release-notes tests
        run: pytest scripts/test_release_notes.py -q
      # U299: the constitution's first principle, made checkable. `.specify/`
      # was touched three times in 292 units while the product was rebuilt
      # around it, and nothing anywhere could notice. Fails on any unit newer
      # than the baseline that no spec claims.
      - name: Spec coverage
        run: |
          pytest scripts/test_spec_drift.py -q
          python scripts/spec_drift.py
      # U315: five paths in AGENTS.md's Key Interfaces block pointed at files
      # that had never existed, and 24 links across the specs resolved to
      # nothing. A link that looks like a link and goes nowhere is worse than
      # no link, for the same reason a stale diagram is (constitution IX).
      - name: Documentation links
        run: |
          pytest scripts/test_check_doc_links.py -q
          python scripts/check_doc_links.py
      # U316: three agents read three filenames. CLAUDE.md did not exist for
      # 292 units, and .github/copilot-instructions.md described a different
      # repository entirely. Keeping the three in step by hand is the bet that
      # lost twice; this checks it instead.
      - name: Agent instructions in step
        run: |
          pytest scripts/test_sync_agent_docs.py -q
          python scripts/sync_agent_docs.py --check
      # U297: the README's screenshots are generated too, and a renamed shot
      # would otherwise leave a broken picture on the front page.
      - name: README-screenshot tests
        run: |
          pip install pillow
          pytest scripts/test_readme_shots.py -q

  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: echo   # U168b: never depend on a real key in CI
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Run shared-schemas tests
        run: uv run --package shared-schemas --extra dev pytest packages/shared-schemas/tests -v

      - name: Run shared-events tests
        run: uv run --package shared-events --extra dev pytest packages/shared-events/tests -v

      - name: Run shared-policies tests
        run: uv run --package shared-policies --extra dev pytest packages/shared-policies/tests -v

      - name: Run shared-personas tests
        run: uv run --package shared-personas --extra dev pytest packages/shared-personas/tests -v

      - name: Run robot-runtime tests
        run: uv run --package robot-runtime --extra dev pytest services/robot-runtime/tests -v

      - name: Run memory-service tests
        run: uv run --package memory-service --extra dev pytest services/memory-service/tests -v

      - name: Run orchestrator tests
        run: uv run --package orchestrator --extra dev pytest services/orchestrator/tests -v

      - name: Run conversation-runtime tests
        run: uv run --package conversation-runtime --extra dev pytest services/conversation-runtime/tests -v

      - name: Run connector-service tests
        run: uv run --package connector-service --extra dev pytest services/connector-service/tests -v
      - name: Test identity-service
        run: uv run --package identity-service --extra dev pytest services/identity-service/tests -v

      - name: Run aura-brain tests
        run: uv run --package aura-brain --extra dev pytest apps/aura-brain/tests -v

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Console tests + build
        working-directory: apps/operator-console
        run: |
          npm ci
          npm test
          npm run build

  # U192: the Electron main process is untyped CommonJS that no other job even
  # parses. An undeclared `token` broke the auto-installer in every release —
  # it threw inside a try/catch that fell back to opening the release page, so
  # the failure looked like a design choice. `no-undef` catches that class.
  desktop-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint Electron main process
        working-directory: apps/desktop
        run: npx --yes eslint@9 main.cjs preload.cjs updater.cjs serving.cjs
      - name: Updater verification tests
        working-directory: apps/desktop
        run: node test-updater-verify.cjs
      - name: Console origin tests
        working-directory: apps/desktop
        run: node test-console-origin.cjs
      - name: Packaging manifest tests
        working-directory: apps/desktop
        run: node test-packaging.cjs
      - name: Bootstrap extras tests
        working-directory: apps/desktop
        run: node test-bootstrap-extras.cjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check packages/ services/
