name: CI

# U166: this repo's branches are master + aura-autobuild — the old
# main/develop triggers meant CI never actually ran on pushes.
#
# U368: every check lives in checks.yml. This file only decides WHEN the gate
# runs; release.yml runs the same gate before it builds. Add a suite there,
# never here — scripts/test_release_gate.py fails if this file grows a list.
on:
  push:
    branches: [master, main, aura-autobuild]
  pull_request:
    branches: [master, main]

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
